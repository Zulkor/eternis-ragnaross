   #rosterAdminContainer {

}

      .roster-card {
        background: linear-gradient(
          135deg,
          rgba(26, 26, 46, 0.95),
          rgba(35, 25, 15, 0.9)
        );
        border: 2px solid rgba(212, 175, 55, 0.4);

        padding: 25px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
        transition: all 0.4s ease;
        position: relative;
        overflow: hidden;
      }

      .roster-card::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 4px;
        background: linear-gradient(90deg, #d4af37, #e0cfa9, #d4af37);
      }

      .roster-card:hover {
        transform: translateY(-8px);

      }

        color: #e0cfa9;

        margin-bottom: 15px;
        text-transform: uppercase;
        letter-spacing: 1px;

      .roster-card p {
        color: #c4b5a0;

      }

      .roster-card a {

        border-bottom: 1px solid rgba(212, 175, 55, 0.3);

      .roster-card a:hover {
        color: #e0cfa9;
        border-bottom-color: #d4af37;
      }

      .player-actions {

      }

      .player-actions button {

      }

      .delete-btn:hover {
        background: linear-gradient(45deg, #ff5252, #ff6b6b);

      .move-btn {

      /* ADD PLAYER FORM */
      #addPlayerForm {
        background: linear-gradient(
          135deg,
          rgba(35, 25, 15, 0.95),

        );
        border: 2px solid rgba(212, 175, 55, 0.4);

        padding: 30px;

      #addPlayerForm h2 {
        color: #e0cfa9;
        text-align: center;
        margin-bottom: 25px;
        font-size: 24px;
        font-weight: 900;
      }

      .form-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
        margin-bottom: 20px;
      }

      .form-row > * {
        display: flex;

      }

      .form-row label {

      }

      #addPlayerForm button[type="submit"] {
        width: 100%;
        padding: 18px;
        background: linear-gradient(45deg, #d4af37, #e0cfa9);
        color: #1a1a2e;
        border: none;
        border-radius: 16px;
        font-weight: 900;
        font-size: 18px;
        cursor: pointer;
        text-transform: uppercase;
        letter-spacing: 1.5px;
        transition: all 0.3s;
      }

      #addPlayerForm button[type="submit"]:hover {
        transform: translateY(-3px);
        box-shadow: 0 20px 40px rgba(212, 175, 55, 0.5);
      }

      .success-message,

        padding: 15px;
        border-radius: 12px;
        margin-top: 15px;
        text-align: center;
        font-weight: 700;
        display: none;
      }
      .success-message {
        background: rgba(34, 197, 94, 0.2);
        color: #22c55e;
        border: 2px solid rgba(34, 197, 94, 0.5);
      }
      .success-message.show {
        display: block;
        animation: pulse 0.6s;
      }
      .error-message {
        color: #ff6b6b;
        background: rgba(255, 107, 107, 0.2);
        border: 2px solid rgba(255, 107, 107, 0.5);
      }
      .error-message.show {
        display: block;
        animation: shake 0.5s;
      }
      @keyframes pulse {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.05);
        }
      }
      @keyframes shake {
        0%,
        100% {
          transform: translateX(0);
        }
        25% {
          transform: translateX(-5px);
        }
        75% {
          transform: translateX(5px);

        display: none;

        }

  <div class="stats-section">
    <h2>Roster Management</h2>
    <form id="addPlayerForm">
      <div class="form-row">
        <div>
          <label for="playerName">Karakter név</label>
          <input type="text" id="playerName" placeholder="Pl: Zulkor" required />
        </div>
        <div>
          <label for="playerClass">Kaszt</label>
          <select id="playerClass" required>
            <option value="">-- Válassz kasztot --</option>
            <option value="Warrior">Warrior</option>
            <option value="Paladin">Paladin</option>
            <option value="Hunter">Hunter</option>
            <option value="Rogue">Rogue</option>
            <option value="Priest">Priest</option>
            <option value="Shaman">Shaman</option>
            <option value="Mage">Mage</option>
            <option value="Warlock">Warlock</option>
            <option value="Monk">Monk</option>
            <option value="Druid">Druid</option>
            <option value="Demon Hunter">Demon Hunter</option>
            <option value="Death Knight">Death Knight</option>
            <option value="Evoker">Evoker</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <div>
          <label for="playerRole">Szerep</label>
          <select id="playerRole" required>
            <option value="">-- Válassz szerepet --</option>
            <option value="Tank">Tank</option>
            <option value="Healer">Healer</option>
            <option value="DPS">DPS</option>
          </select>
        </div>
        <div>
          <label for="playerRaiderIO">Raider.IO</label>
          <input type="url" id="playerRaiderIO" placeholder="https://raider.io/..." required />
        </div>
      </div>
      <button type="submit">➕ Új játékos hozzáadása</button>
    </form>
  </div>
  <div id="rosterAdminContainer"></div>
</div>

    <script>
      // 🔹 FIREBASE INIT
      const firebaseConfig = {
        apiKey: "AIzaSyDxXh_68XFG_n8zUTAg1IPUe0lI4qQalsM",
        authDomain: "eternis-progress.firebaseapp.com",
        databaseURL:
          "https://eternis-progress-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "eternis-progress",
        storageBucket: "eternis-progress.appspot.com",
        messagingSenderId: "820448513456",
        appId: "1:820448513456:web:521976f61a9f6cdc34da75",
      };
      if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
      const db = firebase.database();
      const raidRef = db.ref("raidData");
      const rosterRef = db.ref("rosterData");
      const ADMIN_PASSWORD = "EternisAdminsRoom123!";

      // 🔹 RAID CONFIG
      const ALL_RAIDS = {
        Midnight: {
          "The Voidspire": [
            "Imperator Averzian",
            "Vorasius",
            "Fallen-King Salhadaar",
            "Vaelgor & Ezzorak",
            "Lightblinded Vanguard",
            "Crown of the Cosmos",
          ],
          "The Dreamrift": ["Chimaerus the Undreamt God"],
          "March on Quel'Danas": ["Belo'ren, Child of Al'ar", "Midnight Falls"],
        },
        "The War Within": {
          "Manaforge Omega": [
            "Plexus Sentinel",
            "Loom'ithar",
            "Soulbinder Naazindhri",
            "Forgeweaver Araz",
            "The Soul Hunters",
            "Fractillus",
            "Nexus-King Salhadaar",
            "Dimensius",
          ],
        },
      };

      let raidData = {};
      let rosterData = { players: [] };

      document.addEventListener("DOMContentLoaded", () => {
        document.getElementById("hamburger").onclick = () => {
          document.getElementById("hamburger").classList.toggle("active");
          document.getElementById("nav-menu").classList.toggle("active");
        };

        // 🔹 FETCH RAID DATA
        raidRef.on("value", (snap) => {
          raidData = snap.val() || {};
          if (
            document.getElementById("adminDashboard").classList.contains("show")
          )
            loadRaids();
        });

        // 🔹 FETCH ROSTER DATA
        rosterRef.on("value", (snap) => {
          rosterData = snap.val() || { players: [] };
          if (
            document.getElementById("adminDashboard").classList.contains("show")
          )
            loadRoster();
        });

        // 🔹 ADD PLAYER FORM
        document
          .getElementById("addPlayerForm")
          .addEventListener("submit", (e) => {
            e.preventDefault();
            const player = {
              name: document.getElementById("playerName").value,
              class: document.getElementById("playerClass").value,
              role: document.getElementById("playerRole").value,
              raiderIO: document.getElementById("playerRaiderIO").value,
            };
            addPlayer(player);
            e.target.reset();
          });
      });

      // 🔹 LOGIN / LOGOUT
      function handleLogin(e) {
        e.preventDefault();
        const pass = document.getElementById("passwordInput").value;
        if (pass === ADMIN_PASSWORD) {
          document.getElementById("loginSection").classList.add("hidden");
          document.getElementById("adminDashboard").classList.add("show");
          loadRaids();
          loadRoster();
        } else {
          const err = document.getElementById("errorMessage");
          err.textContent = "❌ Hibás jelszó!";
          err.classList.add("show");
          setTimeout(() => err.classList.remove("show"), 2000);
        }
      }

      function handleLogout() {
        document.getElementById("loginSection").classList.remove("hidden");
        document.getElementById("adminDashboard").classList.remove("show");
      }

      function switchTab(e, tabName) {
        document
          .querySelectorAll(".tab-btn")
          .forEach((btn) => btn.classList.remove("active"));
        e.currentTarget.classList.add("active");
        document
          .querySelectorAll(".tab-content")
          .forEach((tab) => tab.classList.remove("active"));
        document.getElementById(tabName + "-tab").classList.add("active");
      }

      // 🔹 RAID FUNCTIONS
      function loadRaids() {
        const container = document.getElementById("raidsGrid");
        container.innerHTML = "";
        for (let exp in ALL_RAIDS) {
          for (let inst in ALL_RAIDS[exp]) {
            const card = document.createElement("div");
            card.className = "raid-card";
            let html = `<h3>${exp} - ${inst}</h3><div class="boss-list">`;
            ALL_RAIDS[exp][inst].forEach((boss) => {
              const checked = raidData[exp]?.[inst]?.[boss] ? "checked" : "";
              html += `<label class="boss-checkbox"><input type="checkbox" data-expansion="${exp}" data-instance="${inst}" data-boss="${boss}" ${checked} onchange="updateBoss(this)"> ${boss}</label>`;
            });
            html += `</div>`;
            html += `<div class="kill-count" id="count-${encodeURIComponent(exp)}-${encodeURIComponent(inst)}">0 / ${ALL_RAIDS[exp][inst].length}</div>`;
            html += `<button class="update-btn" onclick="saveRaid('${encodeURIComponent(exp)}','${encodeURIComponent(inst)}')">💾 Mentés</button>`;
            card.innerHTML = html;
            container.appendChild(card);
            updateLiveCount(exp, inst);
          }
        }
      }

      function updateBoss(el) {
        const exp = el.dataset.expansion,
          inst = el.dataset.instance,
          boss = el.dataset.boss;
        if (!raidData[exp]) raidData[exp] = {};
        if (!raidData[exp][inst]) raidData[exp][inst] = {};
        raidData[exp][inst][boss] = el.checked;
        updateLiveCount(exp, inst);
      }

      function updateLiveCount(exp, inst) {
        const total = ALL_RAIDS[exp][inst].length;
        const kills = Object.values(raidData[exp]?.[inst] || {}).filter(
          (v) => v,
        ).length;
        const el = document.getElementById(
          `count-${encodeURIComponent(exp)}-${encodeURIComponent(inst)}`,
        );
        if (el) {
          el.textContent = `${kills} / ${total}`;
          el.classList.toggle("complete", kills === total);
        }
      }

      function saveRaid(expEnc, instEnc) {
        const exp = decodeURIComponent(expEnc),
          inst = decodeURIComponent(instEnc);
        raidRef
          .child(`${exp}/${inst}`)
          .set(raidData[exp][inst])
          .then(() => alert("✅ Mentés sikeres!"))
          .catch((err) => alert("❌ Mentés sikertelen: " + err));
      }

      // 🔹 ROSTER FUNCTIONS
      function loadRoster() {
  const container = document.getElementById("rosterAdminContainer");
  container.innerHTML = "";
  
  if (!rosterData.players || rosterData.players.length === 0) {
    container.innerHTML = `
      <div class="empty-roster">
        <h3>📭 Üres roster</h3>
        <p>Adj hozzá játékosokat a fenti űrlappal! 🎮</p>
      </div>
    `;
    return;
  }

  rosterData.players.forEach((player, index) => {
    const card = document.createElement("div");
    card.className = "roster-card";
    card.innerHTML = `
      <div class="player-info">
        <h3>${player.name}</h3>
        <p>🏟️ <strong>Kaszt:</strong> ${player.class}</p>
        <p>⚔️ <strong>Szerep:</strong> ${player.role}</p>
        <p><a href="${player.raiderIO}" target="_blank">📊 Raider.IO megtekintése</a></p>
      </div>
      <div class="player-actions">
        <button class="delete-btn" onclick="deletePlayer(${index})">🗑️ Törlés</button>
        <button class="move-btn" onclick="movePlayer(${index}, ${index-1})" ${index===0?'disabled':''}>⬆️ Fel</button>
        <button class="move-btn" onclick="movePlayer(${index}, ${index+1})">⬇️ Le</button>
      </div>
    `;
    container.appendChild(card);
  });
}

      

      function addPlayer(player) {
        rosterData.players.push(player);
        saveRoster();
      }

      function deletePlayer(idx) {
        rosterData.players.splice(idx, 1);
        saveRoster();
      }

      function movePlayer(oldIdx, newIdx) {
        if (newIdx < 0 || newIdx >= rosterData.players.length) return;
        const [player] = rosterData.players.splice(oldIdx, 1);
        rosterData.players.splice(newIdx, 0, player);
        saveRoster();
      }

      function saveRoster() {
        rosterRef
          .set(rosterData)
          .then(() => {
            loadRoster();
            localStorage.setItem(
              "rosterData",
              JSON.stringify(rosterData.players),
            );
            window.dispatchEvent(new Event("rosterDataUpdated"));
            alert("✅ Roster updated successfully!");
          })
          .catch((err) => alert("❌ Failed to save roster: " + err));
      }
    </script>
  </body>
</html>
