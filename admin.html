<!doctype html>
<html lang="hu">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Eternis Raid Admin</title>

    <!-- Firebase 8 compat -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
      /* --- YOUR EXISTING CSS KEPT AS-IS --- */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: linear-gradient(
          135deg,
          #0f0f23 0%,
          #1a1a2e 50%,
          #16213e 100%
        );
        color: #fff;
        min-height: 100vh;
        padding: 20px;
      }
      .header-container {
        max-width: 1200px;
        margin: 0 auto 40px;
        padding: 0 20px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: rgba(26, 26, 46, 0.8);
        backdrop-filter: blur(20px);
        border-radius: 20px;
        padding: 15px 25px;
        border: 1px solid rgba(212, 175, 55, 0.2);
      }
      .logo {
        font-size: 32px;
        font-weight: 900;
        background: linear-gradient(45deg, #e0cfa9, #d4af37, #f4e4bc);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        text-decoration: none;
      }
      .hamburger {
        display: none;
        flex-direction: column;
        background: none;
        border: none;
        cursor: pointer;
        padding: 10px;
      }
      .hamburger span {
        width: 28px;
        height: 3px;
        background: #d4af37;
        margin: 3px 0;
        border-radius: 2px;
        transition: 0.3s;
      }
      .hamburger.active span:nth-child(1) {
        transform: rotate(-45deg) translate(-6px, 6px);
      }
      .hamburger.active span:nth-child(2) {
        opacity: 0;
      }
      .hamburger.active span:nth-child(3) {
        transform: rotate(45deg) translate(-6px, -6px);
      }
      nav ul {
        display: flex;
        list-style: none;
        gap: 30px;
      }
      nav a {
        color: #c4b5a0;
        text-decoration: none;
        font-weight: 700;
        padding: 8px 16px;
        border-radius: 12px;
        transition: all 0.3s;
      }
      nav a:hover {
        color: #d4af37;
        background: rgba(212, 175, 55, 0.2);
      }
      .admin-container {
        max-width: 1400px;
        margin: 0 auto;
      }
      .login-section {
        background: rgba(35, 25, 15, 0.9);
        border: 2px solid rgba(212, 175, 55, 0.4);
        border-radius: 24px;
        padding: 50px;
        backdrop-filter: blur(25px);
        box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
      }
      .login-section.hidden {
        display: none;
      }
      .admin-header h1 {
        font-size: 56px;
        background: linear-gradient(45deg, #e0cfa9, #d4af37);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        margin-bottom: 15px;
        text-align: center;
      }
      .form-group label {
        display: block;
        margin-bottom: 10px;
        color: #d4af37;
        font-weight: 700;
        font-size: 14px;
        text-transform: uppercase;
        letter-spacing: 1.5px;
      }
      .form-group input {
        width: 100%;
        padding: 16px 20px;
        border: 2px solid rgba(212, 175, 55, 0.3);
        background: rgba(0, 0, 0, 0.5);
        color: #fff;
        border-radius: 12px;
        font-size: 16px;
        transition: all 0.3s;
        font-weight: 500;
      }
      .form-group input:focus {
        outline: none;
        border-color: #d4af37;
        box-shadow: 0 0 20px rgba(212, 175, 55, 0.4);
        background: rgba(0, 0, 0, 0.7);
      }
      .login-btn {
        width: 100%;
        padding: 18px;
        background: linear-gradient(45deg, #d4af37, #e0cfa9);
        color: #1a1a2e;
        border: none;
        border-radius: 12px;
        font-weight: 800;
        font-size: 18px;
        cursor: pointer;
        transition: all 0.3s;
        text-transform: uppercase;
        letter-spacing: 2px;
      }
      .login-btn:hover {
        transform: translateY(-3px);
        box-shadow: 0 20px 40px rgba(212, 175, 55, 0.4);
        background: linear-gradient(45deg, #e0cfa9, #d4af37);
      }
      .admin-dashboard {
        display: none;
      }
      .admin-dashboard.show {
        display: block;
      }
      .admin-header-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 40px;
        padding: 25px 30px;
        background: linear-gradient(
          135deg,
          rgba(35, 25, 15, 0.9),
          rgba(52, 38, 22, 0.8)
        );
        border: 2px solid rgba(212, 175, 55, 0.4);
        border-radius: 20px;
        backdrop-filter: blur(25px);
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      }
      .admin-tabs {
        display: flex;
        gap: 15px;
        margin-bottom: 40px;
        padding: 20px;
        background: rgba(26, 26, 46, 0.8);
        border-radius: 20px;
        border: 1px solid rgba(212, 175, 55, 0.3);
        backdrop-filter: blur(20px);
        flex-wrap: wrap;
      }
      .tab-btn {
        padding: 16px 32px;
        background: transparent;
        color: #c4b5a0;
        border: none;
        border-radius: 15px;
        cursor: pointer;
        font-weight: 700;
        font-size: 15px;
        text-transform: uppercase;
        letter-spacing: 1px;
        transition: all 0.3s;
      }
      .tab-btn:hover {
        color: #d4af37;
        background: rgba(212, 175, 55, 0.2);
        transform: translateY(-2px);
      }
      .tab-btn.active {
        color: #d4af37;
        background: linear-gradient(
          45deg,
          rgba(212, 175, 55, 0.3),
          rgba(224, 207, 169, 0.3)
        );
        box-shadow: 0 10px 25px rgba(212, 175, 55, 0.3);
      }
      .raids-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(380px, 1fr));
        gap: 25px;
        margin-bottom: 30px;
      }
      .raid-card {
        background: linear-gradient(
          135deg,
          rgba(35, 25, 15, 0.95),
          rgba(52, 38, 22, 0.9)
        );
        border: 2px solid rgba(212, 175, 55, 0.4);
        border-radius: 24px;
        padding: 30px;
        backdrop-filter: blur(25px);
        transition: all 0.4s;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        position: relative;
        overflow: hidden;
      }
      .raid-card::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 4px;
        background: linear-gradient(90deg, #d4af37, #e0cfa9, #d4af37);
      }
      .raid-card:hover {
        transform: translateY(-8px);
        border-color: #d4af37;
        box-shadow: 0 30px 60px rgba(212, 175, 55, 0.3);
      }
      .raid-card h3 {
        color: #e0cfa9;
        margin-bottom: 25px;
        font-size: 22px;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 2px;
        text-align: center;
        background: linear-gradient(45deg, #e0cfa9, #d4af37);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .boss-list {
        max-height: 280px;
        overflow-y: auto;
        margin: 20px 0;
        padding: 20px;
        background: rgba(0, 0, 0, 0.6);
        border-radius: 16px;
        border: 1px solid rgba(212, 175, 55, 0.3);
        scrollbar-width: thin;
        scrollbar-color: #d4af37 rgba(0, 0, 0, 0.5);
      }
      .boss-list::-webkit-scrollbar {
        width: 8px;
      }
      .boss-list::-webkit-scrollbar-track {
        background: rgba(0, 0, 0, 0.3);
        border-radius: 4px;
      }
      .boss-list::-webkit-scrollbar-thumb {
        background: #d4af37;
        border-radius: 4px;
      }
      .boss-checkbox {
        display: flex;
        align-items: center;
        padding: 14px 16px;
        margin: 8px 0;
        cursor: pointer;
        border-radius: 12px;
        transition: all 0.3s;
        font-size: 15px;
        font-weight: 500;
        border: 1px solid transparent;
      }
      .boss-checkbox:hover {
        background: linear-gradient(
          90deg,
          rgba(212, 175, 55, 0.15),
          rgba(212, 175, 55, 0.05)
        );
        border-color: rgba(212, 175, 55, 0.3);
        transform: translateX(5px);
      }
      .boss-checkbox input[type="checkbox"] {
        margin-right: 16px;
        transform: scale(1.3);
        accent-color: #d4af37;
        width: 20px;
        height: 20px;
      }
      .kill-count {
        font-size: 24px;
        font-weight: 900;
        color: #e0cfa9;
        margin: 25px 0;
        padding: 20px;
        background: linear-gradient(
          135deg,
          rgba(212, 175, 55, 0.2),
          rgba(224, 207, 169, 0.1)
        );
        border-radius: 16px;
        border: 2px solid rgba(212, 175, 55, 0.4);
        text-align: center;
        text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
      }
      .kill-count.complete {
        color: #00ff88 !important;
        background: linear-gradient(
          135deg,
          rgba(0, 255, 136, 0.2),
          rgba(0, 255, 136, 0.1)
        );
        border-color: rgba(0, 255, 136, 0.6);
      }
      .update-btn {
        width: 100%;
        padding: 16px;
        background: linear-gradient(45deg, #d4af37, #e0cfa9);
        color: #1a1a2e;
        border: none;
        border-radius: 12px;
        font-weight: 800;
        font-size: 16px;
        cursor: pointer;
        transition: all 0.3s;
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-bottom: 15px;
      }
      .update-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 15px 30px rgba(212, 175, 55, 0.4);
      }
      .stats-section {
        background: linear-gradient(
          135deg,
          rgba(35, 25, 15, 0.95),
          rgba(52, 38, 22, 0.9)
        );
        border: 2px solid rgba(212, 175, 55, 0.4);
        border-radius: 24px;
        padding: 35px;
        backdrop-filter: blur(25px);
        margin-bottom: 40px;
        box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
      }
      .stats-section h2 {
        color: #e0cfa9;
        margin-bottom: 25px;
        font-size: 24px;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 2px;
        text-align: center;
      }
      .stats-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 20px;
      }
      .stat-item {
        background: linear-gradient(
          135deg,
          rgba(0, 0, 0, 0.6),
          rgba(26, 26, 46, 0.6)
        );
        border: 2px solid rgba(212, 175, 55, 0.3);
        border-radius: 20px;
        padding: 25px;
        text-align: center;
        transition: all 0.3s;
      }
      .stat-item:hover {
        transform: translateY(-5px);
        border-color: #d4af37;
      }
      .stat-item h4 {
        color: #c4b5a0;
        font-size: 13px;
        text-transform: uppercase;
        margin-bottom: 12px;
        letter-spacing: 1px;
      }
      .stat-value {
        font-size: 42px;
        color: #d4af37;
        font-weight: 900;
        text-shadow: 0 2px 8px rgba(212, 175, 55, 0.5);
      }
      .success-message,
      .error-message {
        padding: 15px;
        border-radius: 12px;
        margin-top: 15px;
        text-align: center;
        font-weight: 700;
        display: none;
      }
      .success-message {
        background: rgba(34, 197, 94, 0.2);
        color: #22c55e;
        border: 2px solid rgba(34, 197, 94, 0.5);
      }
      .success-message.show {
        display: block;
        animation: pulse 0.6s;
      }
      .error-message {
        color: #ff6b6b;
        background: rgba(255, 107, 107, 0.2);
        border: 2px solid rgba(255, 107, 107, 0.5);
      }
      .error-message.show {
        display: block;
        animation: shake 0.5s;
      }
      @keyframes pulse {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.05);
        }
      }
      @keyframes shake {
        0%,
        100% {
          transform: translateX(0);
        }
        25% {
          transform: translateX(-5px);
        }
        75% {
          transform: translateX(5px);
        }
      }
      .tab-content {
        display: none;
      }
      .tab-content.active {
        display: block;
      }
      .logout-btn {
        padding: 12px 24px;
        background: rgba(255, 107, 107, 0.2);
        color: #ff6b6b;
        border: 2px solid rgba(255, 107, 107, 0.5);
        border-radius: 12px;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.3s;
      }
      .logout-btn:hover {
        background: rgba(255, 107, 107, 0.4);
        transform: translateY(-2px);
      }
      @media (max-width: 768px) {
        .hamburger {
          display: flex;
        }
        nav {
          display: none;
          position: absolute;
          top: 100%;
          left: 0;
          right: 0;
          background: rgba(26, 26, 46, 0.98);
          flex-direction: column;
          padding: 25px;
          border-radius: 20px;
          margin: 10px 20px;
        }
        nav.active {
          display: flex;
        }
        nav ul {
          flex-direction: column;
          gap: 15px;
          width: 100%;
        }
        .raids-grid {
          grid-template-columns: 1fr;
        }
        .admin-header h1 {
          font-size: 42px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="header-container">
        <div class="logo"><a href="index.html">Eternis</a></div>
        <button class="hamburger" id="hamburger">
          <span></span><span></span><span></span>
        </button>
        <nav id="nav-menu">
          <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="progress.html">Progress</a></li>
            <li><a href="rules.html">Szabályok</a></li>
            <li><a href="apply.html">Jelentkezés</a></li>
            <li><a href="admin.html">Admin</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <div class="admin-container">
      <div class="login-section" id="loginSection">
        <div class="admin-header">
          <h1>🔐 Admin Panel</h1>
          <p>Eternis Guild Raid Tracker</p>
        </div>
        <form onsubmit="handleLogin(event)">
          <div class="form-group">
            <label for="passwordInput">Admin Jelszó</label>
            <input
              type="password"
              id="passwordInput"
              placeholder="Add meg az admin jelszót"
              required
            />
          </div>
          <button type="submit" class="login-btn">🔓 Bejelentkezés</button>
          <div class="error-message" id="errorMessage"></div>
        </form>
      </div>

      <div class="admin-dashboard" id="adminDashboard">
        <div class="admin-header-bar">
          <div class="admin-welcome">
            Üdvözlünk, <strong>Zulkor</strong>! 👑
          </div>
          <button class="logout-btn" onclick="handleLogout()">
            🚪 Kijelentkezés
          </button>
        </div>

        <div class="admin-tabs">
          <button class="tab-btn active" onclick="switchTab(event, 'raids')">
            ⚔️ Raid Progress
          </button>
        </div>

        <div id="raids-tab" class="tab-content active">
          <div class="raids-grid" id="raidsGrid"></div>
        </div>
      </div>
    </div>

    <script>
      console.log("🔥 ADMIN START");

      const firebaseConfig = {
        apiKey: "AIzaSyDxXh_68XFG_n8zUTAg1IPUe0lI4qQalsM",
        authDomain: "eternis-progress.firebaseapp.com",
        databaseURL:
          "https://eternis-progress-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "eternis-progress",
        storageBucket: "eternis-progress.appspot.com",
        messagingSenderId: "820448513456",
        appId: "1:820448513456:web:521976f61a9f6cdc34da75",
      };

      firebase.initializeApp(firebaseConfig);
      const db = firebase.database();
      const raidRef = db.ref("raidData");
      const ADMIN_PASSWORD = "EternisAdminsRoom123!";

      const ALL_RAIDS = {
        Midnight: {
          "The Voidspire": {
            total: 6,
            bosses: [
              "Imperator Averzian",
              "Vorasius",
              "Fallen-King Salhadaar",
              "Vaelgor & Ezzorak",
              "Lightblinded Vanguard",
              "Crown of the Cosmos",
            ],
          },
          "The Dreamrift": {
            total: 1,
            bosses: ["Chimaerus the Undreamt God"],
          },
          "March on Quel'Danas": {
            total: 2,
            bosses: ["Belo'ren, Child of Al'ar", "Midnight Falls"],
          },
        },
        "The War Within": {
          "Manaforge Omega": {
            total: 8,
            bosses: [
              "Plexus Sentinel",
              "Loom'ithar",
              "Soulbinder Naazindhri",
              "Forgeweaver Araz",
              "The Soul Hunters",
              "Fractillus",
              "Nexus-King Salhadaar",
              "Dimensius",
            ],
          },
        },
      };

      let raidData = {};

      document.addEventListener("DOMContentLoaded", function () {
        document.getElementById("hamburger").onclick = function () {
          this.classList.toggle("active");
          document.getElementById("nav-menu").classList.toggle("active");
        };

        raidRef.on("value", (snap) => {
          raidData = snap.val() || {};
          if (
            document.getElementById("adminDashboard").classList.contains("show")
          ) {
            loadRaids();
          }
        });
      });

      function handleLogin(e) {
        e.preventDefault();
        const pass = document.getElementById("passwordInput").value;
        if (pass === ADMIN_PASSWORD) {
          document.getElementById("loginSection").classList.add("hidden");
          document.getElementById("adminDashboard").classList.add("show");
          loadRaids();
        } else {
          const err = document.getElementById("errorMessage");
          err.textContent = "❌ Hibás jelszó!";
          err.classList.add("show");
          setTimeout(() => err.classList.remove("show"), 2000);
        }
      }

      function handleLogout() {
        document.getElementById("loginSection").classList.remove("hidden");
        document.getElementById("adminDashboard").classList.remove("show");
      }

      function switchTab(e, tabName) {
        document
          .querySelectorAll(".tab-btn")
          .forEach((btn) => btn.classList.remove("active"));
        e.currentTarget.classList.add("active");
        document
          .querySelectorAll(".tab-content")
          .forEach((tab) => tab.classList.remove("active"));
        document.getElementById(tabName + "-tab").classList.add("active");
      }

      function loadRaids() {
        const container = document.getElementById("raidsGrid");
        container.innerHTML = "";
        for (let expansion in ALL_RAIDS) {
          const raids = ALL_RAIDS[expansion];
          for (let instance in raids) {
            const card = document.createElement("div");
            card.className = "raid-card";
            let html = `<h3>${expansion} - ${instance}</h3><div class="boss-list">`;
            raids[instance].bosses.forEach((boss) => {
              const checked = raidData[expansion]?.[instance]?.[boss]
                ? "checked"
                : "";
              html += `<label class="boss-checkbox"><input type="checkbox" data-expansion="${expansion}" data-instance="${instance}" data-boss="${boss}" ${checked} onchange="updateBoss(this)"> ${boss}</label>`;
            });
            html += `</div>`;
            html += `<div class="kill-count" id="count-${encodeURIComponent(expansion)}-${encodeURIComponent(instance)}">0 / ${raids[instance].total}</div>`;
            html += `<button class="update-btn" onclick="saveRaid(\`${encodeURIComponent(expansion)}\`, \`${encodeURIComponent(instance)}\`)">💾 Mentés</button>`;
            card.innerHTML = html;
            container.appendChild(card);
            updateLiveCount(expansion, instance);
          }
        }
      }

      function updateBoss(el) {
        const expansion = el.dataset.expansion;
        const instance = el.dataset.instance;
        const boss = el.dataset.boss;
        if (!raidData[expansion]) raidData[expansion] = {};
        if (!raidData[expansion][instance]) raidData[expansion][instance] = {};
        raidData[expansion][instance][boss] = el.checked;
        updateLiveCount(expansion, instance);
      }

      function updateLiveCount(expansion, instance) {
        const total = ALL_RAIDS[expansion][instance].total;
        const kills = Object.values(
          raidData[expansion]?.[instance] || {},
        ).filter((v) => v).length;
        const el = document.getElementById(
          `count-${encodeURIComponent(expansion)}-${encodeURIComponent(instance)}`,
        );
        if (el) {
          el.textContent = `${kills} / ${total}`;
          el.classList.toggle("complete", kills === total);
        }
      }

      function saveRaid(expansionEncoded, instanceEncoded) {
        const expansion = decodeURIComponent(expansionEncoded);
        const instance = decodeURIComponent(instanceEncoded);
        raidRef
          .child(`${expansion}/${instance}`)
          .set(raidData[expansion][instance])
          .then(() => alert("✅ Mentés sikeres!"))
          .catch((err) => alert("❌ Mentés sikertelen: " + err));
      }
    </script>
  </body>
</html>
