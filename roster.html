<!doctype html>
<html lang="hu">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Eternis - WoW Guild | Roster</title>
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/roster-styles.css" />
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  </head>
  <body>
    <div class="bg-wrapper"></div>

    <header>
      <div class="header-container">
        <div class="logo">
          <a href="index.html" class="logo">Eternis</a>
        </div>
        <button class="hamburger" id="hamburger">
          <span></span><span></span><span></span>
        </button>
        <nav id="nav-menu">
          <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="gallery.html">Gallery</a></li>
            <li><a href="progress.html">Progress</a></li>
            <li><a href="rules.html">Szabályok</a></li>
            <li><a href="apply.html">Jelentkezés</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <main class="roster-hero">
      <div class="roster-hero-overlay">
        <div class="roster-hero-content">
          <h1>Eternis Roster</h1>
          <p id="playerCount">Betöltés...</p>
        </div>

        <div class="roster-table-wrapper">
          <table class="roster-table">
            <thead>
              <tr>
                <th>Character</th>
                <th>Class</th>
                <th>Role</th>
                <th>Raider.IO</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody id="rosterTableBody">
              <tr>
                <td colspan="5" style="text-align: center; color: #888">
                  Betöltés...
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>

    <footer>
      <div class="footer-content">
        <div class="footer-logo">Eternis</div>
        <div class="footer-links">
          <a
            href="https://discord.gg/amyuhxfJ"
            target="_blank"
            class="footer-link"
            >Discord</a
          >
          <a href="apply.html" class="footer-link">Apply</a>
          <a href="rules.html" class="footer-link">Szabályok</a>
        </div>
        <div class="footer-info">
          <p>Mythic raiding guild | CE or bust | Trial applications open</p>
        </div>
        <div class="footer-divider"></div>
        <p class="footer-copyright">
          © 2026 Eternis Guild. All rights reserved.
        </p>
      </div>
    </footer>

    <script>
      // ============================================
      // Firebase Setup
      // ============================================
      const firebaseConfig = {
        apiKey: "AIzaSyDxXh_68XFG_n8zUTAg1IPUe0lI4qQalsM",
        authDomain: "eternis-progress.firebaseapp.com",
        databaseURL:
          "https://eternis-progress-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "eternis-progress",
        storageBucket: "eternis-progress.appspot.com",
        messagingSenderId: "820448513456",
        appId: "1:820448513456:web:521976f61a9f6cdc34da75",
      };
      firebase.initializeApp(firebaseConfig);
      const rosterRef = firebase.database().ref("rosterData/players");

      // ============================================
      // CLASS & ROLE MAPPING
      // ============================================
      const classColorMap = {
        Warrior: "class-warrior",
        Paladin: "class-paladin",
        Hunter: "class-hunter",
        Rogue: "class-rogue",
        Priest: "class-priest",
        Shaman: "class-shaman",
        Mage: "class-mage",
        Warlock: "class-warlock",
        Monk: "class-monk",
        Druid: "class-druid",
        "Demon Hunter": "class-demon-hunter",
        "Death Knight": "class-death-knight",
        Evoker: "class-evoker",
      };
      const roleMap = { Tank: "tank", Healer: "healer", DPS: "dps" };

      // ============================================
      // ROSTER MANAGEMENT
      // ============================================
      let rosterData = [];

      function renderRosterTable() {
        const tbody = document.getElementById("rosterTableBody");
        const playerCount = document.getElementById("playerCount");

        tbody.innerHTML = "";

        if (!rosterData || rosterData.length === 0) {
          tbody.innerHTML = `
      <tr>
        <td colspan="5" style="text-align:center;color:#888;">
          Jelenleg nincs játékos a rosztérben
        </td>
      </tr>`;
          playerCount.textContent = "0 játékos";
          return;
        }

        // 🔹 IMPORTANT: DO NOT SORT — keep Firebase order
        rosterData.forEach((player) => {
          const classColorClass = classColorMap[player.class] || "";
          const roleClass = roleMap[player.role] || "dps";

          const row = document.createElement("tr");

          row.innerHTML = `
      <td><span class="player-name ${classColorClass}">${player.name}</span></td>
      <td>${player.class}</td>
      <td><span class="role-badge ${roleClass}">${player.role}</span></td>
      <td><a href="${player.raiderIO}" target="_blank" class="raiderio-link">Raider.IO</a></td>
      <td><span class="status-active">Active</span></td>
    `;

          tbody.appendChild(row);
        });

        playerCount.textContent = `${rosterData.length} Player`;
      }

      // ============================================
      // Load from Firebase & LocalStorage fallback
      // ============================================
      function loadRoster() {
        rosterRef.on("value", (snapshot) => {
          const data = snapshot.val();

          if (data && Array.isArray(data)) {
            rosterData = data;

            localStorage.setItem("rosterData", JSON.stringify(rosterData));

            renderRosterTable();
          } else {
            const saved = localStorage.getItem("rosterData");

            if (saved) rosterData = JSON.parse(saved);

            renderRosterTable();
          }
        });
      }

      document.addEventListener("DOMContentLoaded", () => {
        console.log("🔄 Roster page initializing...");
        loadRoster();
      });

      // Listen for updates from admin.js
      window.addEventListener("rosterDataUpdated", () => {
        loadRoster();
      });

      // Storage event for multi-tab
      window.addEventListener("storage", (event) => {
        if (event.key === "rosterData") loadRoster();
      });

      // Hamburger toggle
      const hamburger = document.getElementById("hamburger");
      const navMenu = document.getElementById("nav-menu");
      hamburger.addEventListener("click", () => {
        hamburger.classList.toggle("active");
        navMenu.classList.toggle("active");
      });
    </script>
  </body>
</html>
