<!doctype html>
<html lang="hu">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Eternis - Admin Panel</title>
    <link rel="stylesheet" href="css/styles.css" />
    <header>
      <div class="header-container">
        <div class="logo">
          <a href="index.html" class="logo">Eternis</a>
        </div>

        <!-- Hamburger -->
        <button class="hamburger" id="hamburger">
          <span></span>
          <span></span>
          <span></span>
        </button>

        <!-- Navigation -->
        <nav id="nav-menu">
          <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="roster.html">Roster</a></li>
            <li><a href="gallery.html">Gallery</a></li>
            <li><a href="progress.html">Progress</a></li>
            <li><a href="rules.html">Szabályok</a></li>
            <li><a href="apply.html">Jelentkezés</a></li>
            <li><a href="admin.html">Admin</a></li>
          </ul>
        </nav>
      </div>
    </header>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
        color: #fff;
        min-height: 100vh;
        padding: 20px;
      }

      .admin-container {
        max-width: 900px;
        margin: 0 auto;
      }

      .admin-header {
        text-align: center;
        margin-bottom: 40px;
        padding-top: 40px;
      }

      .admin-header h1 {
        font-size: 48px;
        background: linear-gradient(to bottom, #e0cfa9, #d4af37);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        margin-bottom: 10px;
      }

      .admin-header p {
        color: #888;
        font-size: 16px;
      }

      /* Login Section */
      .login-section {
        background: rgba(35, 25, 15, 0.7);
        border: 1px solid rgba(212, 175, 55, 0.3);
        border-radius: 16px;
        padding: 40px;
        margin-bottom: 30px;
        backdrop-filter: blur(10px);
      }

      .login-section.hidden {
        display: none;
      }

      .form-group {
        margin-bottom: 20px;
      }

      .form-group label {
        display: block;
        margin-bottom: 8px;
        color: #d4af37;
        font-weight: 600;
        font-size: 14px;
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      .form-group input,
      .form-group select {
        width: 100%;
        padding: 12px 16px;
        border: 1px solid rgba(212, 175, 55, 0.3);
        background: rgba(0, 0, 0, 0.3);
        color: #fff;
        border-radius: 8px;
        font-size: 14px;
        transition: all 0.3s ease;
        font-family: inherit;
      }

      .form-group input:focus,
      .form-group select:focus {
        outline: none;
        border-color: #d4af37;
        box-shadow: 0 0 10px rgba(212, 175, 55, 0.3);
      }

      .login-btn {
        width: 100%;
        padding: 14px;
        background: #d4af37;
        color: #1a1a2e;
        border: none;
        border-radius: 8px;
        font-weight: 700;
        font-size: 16px;
        cursor: pointer;
        transition: all 0.3s ease;
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      .login-btn:hover {
        background: #e0cfa9;
        transform: translateY(-2px);
        box-shadow: 0 10px 25px rgba(212, 175, 55, 0.3);
      }

      .error-message {
        color: #ff4444;
        font-size: 14px;
        margin-top: 10px;
        text-align: center;
        display: none;
      }

      .error-message.show {
        display: block;
      }

      /* Admin Dashboard */
      .admin-dashboard {
        display: none;
      }

      .admin-dashboard.show {
        display: block;
      }

      .admin-header-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 40px;
        padding: 20px;
        background: rgba(35, 25, 15, 0.7);
        border: 1px solid rgba(212, 175, 55, 0.3);
        border-radius: 12px;
        backdrop-filter: blur(10px);
      }

      .admin-welcome {
        font-size: 18px;
      }

      .admin-welcome strong {
        color: #d4af37;
      }

      .logout-btn {
        padding: 10px 20px;
        background: rgba(212, 175, 55, 0.2);
        color: #d4af37;
        border: 1px solid #d4af37;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 600;
        transition: all 0.3s ease;
      }

      .logout-btn:hover {
        background: rgba(212, 175, 55, 0.3);
        transform: translateY(-2px);
      }

      /* Tab Navigation */
      .admin-tabs {
        display: flex;
        gap: 10px;
        margin-bottom: 30px;
        border-bottom: 2px solid rgba(212, 175, 55, 0.2);
        flex-wrap: wrap;
      }

      .tab-btn {
        padding: 12px 24px;
        background: transparent;
        color: #888;
        border: none;
        border-bottom: 3px solid transparent;
        cursor: pointer;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 1px;
        font-size: 14px;
        transition: all 0.3s ease;
      }

      .tab-btn:hover {
        color: #d4af37;
      }

      .tab-btn.active {
        color: #d4af37;
        border-bottom-color: #d4af37;
      }

      /* Tab Content */
      .tab-content {
        display: none;
      }

      .tab-content.active {
        display: block;
      }

      /* Raid Cards */
      .raids-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 20px;
        margin-bottom: 30px;
      }

      .raid-card {
        background: rgba(35, 25, 15, 0.7);
        border: 1px solid rgba(212, 175, 55, 0.3);
        border-radius: 12px;
        padding: 24px;
        backdrop-filter: blur(10px);
        transition: all 0.3s ease;
      }

      .raid-card:hover {
        border-color: #d4af37;
        box-shadow: 0 8px 25px rgba(212, 175, 55, 0.2);
      }

      .raid-card h3 {
        color: #d4af37;
        margin-bottom: 20px;
        font-size: 18px;
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      .raid-card .form-group {
        margin-bottom: 16px;
      }

      .update-btn {
        width: 100%;
        padding: 12px;
        background: rgba(212, 175, 55, 0.2);
        color: #d4af37;
        border: 1px solid #d4af37;
        border-radius: 8px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        text-transform: uppercase;
        letter-spacing: 1px;
        font-size: 14px;
      }

      .update-btn:hover {
        background: #d4af37;
        color: #1a1a2e;
        transform: translateY(-2px);
      }

      .success-message {
        background: rgba(34, 197, 94, 0.1);
        color: #22c55e;
        padding: 12px;
        border-radius: 8px;
        border: 1px solid rgba(34, 197, 94, 0.3);
        margin-top: 12px;
        text-align: center;
        font-size: 14px;
        display: none;
      }

      .success-message.show {
        display: block;
      }

      /* Stats */
      .stats-section {
        background: rgba(35, 25, 15, 0.7);
        border: 1px solid rgba(212, 175, 55, 0.3);
        border-radius: 12px;
        padding: 24px;
        backdrop-filter: blur(10px);
        margin-bottom: 30px;
      }

      .stats-section h2 {
        color: #d4af37;
        margin-bottom: 20px;
        font-size: 20px;
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      .stats-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 16px;
      }

      .stat-item {
        background: rgba(0, 0, 0, 0.3);
        border: 1px solid rgba(212, 175, 55, 0.2);
        border-radius: 8px;
        padding: 16px;
        text-align: center;
      }

      .stat-item h4 {
        color: #888;
        font-size: 12px;
        text-transform: uppercase;
        margin-bottom: 8px;
      }

      .stat-item .stat-value {
        font-size: 32px;
        color: #d4af37;
        font-weight: 900;
      }

      /* Roster Section */
      .add-player-section {
        background: rgba(35, 25, 15, 0.7);
        border: 1px solid rgba(212, 175, 55, 0.3);
        border-radius: 12px;
        padding: 24px;
        backdrop-filter: blur(10px);
        margin-bottom: 30px;
      }

      .add-player-section h3 {
        color: #d4af37;
        margin-bottom: 20px;
        font-size: 18px;
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      .form-row {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 15px;
        margin-bottom: 20px;
      }

      .add-btn {
        width: 100%;
        padding: 14px;
        background: #d4af37;
        color: #1a1a2e;
        border: none;
        border-radius: 8px;
        font-weight: 700;
        font-size: 16px;
        cursor: pointer;
        transition: all 0.3s ease;
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      .add-btn:hover {
        background: #e0cfa9;
        transform: translateY(-2px);
        box-shadow: 0 10px 25px rgba(212, 175, 55, 0.3);
      }

      /* Roster Table */
      .roster-table-wrapper {
        background: rgba(35, 25, 15, 0.7);
        border: 1px solid rgba(212, 175, 55, 0.3);
        border-radius: 12px;
        overflow: hidden;
        margin-bottom: 30px;
        backdrop-filter: blur(10px);
      }

      .roster-table {
        width: 100%;
        border-collapse: collapse;
        color: #c4b5a0;
      }

      .roster-table thead {
        background: linear-gradient(90deg, #8b6f47 0%, #6b4e2f 100%);
      }

      .roster-table th {
        color: #fff;
        padding: 16px;
        text-align: left;
        font-weight: 800;
        text-transform: uppercase;
        border-bottom: 2px solid #d4af37;
        letter-spacing: 1px;
        font-size: 12px;
      }

      .roster-table td {
        padding: 12px 16px;
        border-bottom: 1px solid rgba(212, 175, 55, 0.1);
      }

      .roster-table tr:hover {
        background: rgba(212, 175, 55, 0.06);
      }

      .class-tag {
        display: inline-block;
        padding: 4px 12px;
        border-radius: 6px;
        font-size: 12px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      .role-badge {
        display: inline-block;
        padding: 4px 12px;
        border-radius: 6px;
        font-size: 12px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      .role-tank {
        background: rgba(54, 162, 235, 0.2);
        color: #36a2eb;
      }

      .role-healer {
        background: rgba(75, 192, 75, 0.2);
        color: #4bc04b;
      }

      .role-dps {
        background: rgba(255, 99, 132, 0.2);
        color: #ff6384;
      }

      .delete-btn {
        padding: 6px 12px;
        background: rgba(255, 68, 68, 0.2);
        color: #ff4444;
        border: 1px solid #ff4444;
        border-radius: 6px;
        cursor: pointer;
        font-size: 12px;
        font-weight: 600;
        transition: all 0.3s ease;
      }

      .delete-btn:hover {
        background: #ff4444;
        color: #1a1a2e;
      }

      @media (max-width: 768px) {
        .admin-header h1 {
          font-size: 32px;
        }

        .raids-grid {
          grid-template-columns: 1fr;
        }

        .admin-header-bar {
          flex-direction: column;
          gap: 15px;
          text-align: center;
        }

        .logout-btn {
          width: 100%;
        }

        .form-row {
          grid-template-columns: 1fr;
        }

        .roster-table {
          font-size: 12px;
        }

        .roster-table th,
        .roster-table td {
          padding: 8px;
        }
      }
    </style>
  </head>
  <body>
    <div class="admin-container">
      <!-- Login Section -->
      <div class="login-section" id="loginSection">
        <div class="admin-header">
          <h1>🔐 Admin Panel</h1>
          <p>Eternis Guild Raid Tracker</p>
        </div>

        <form onsubmit="handleLogin(event)">
          <div class="form-group">
            <label for="passwordInput">Admin Jelszó</label>
            <input
              type="password"
              id="passwordInput"
              placeholder="Add meg az admin jelszót"
              required
            />
          </div>

          <button type="submit" class="login-btn">🔓 Bejelentkezés</button>

          <div class="error-message" id="errorMessage"></div>
        </form>
      </div>

      <!-- Admin Dashboard -->
      <div class="admin-dashboard" id="adminDashboard">
        <!-- Header -->
        <div class="admin-header-bar">
          <div class="admin-welcome">
            Üdvözlünk, <strong>Zulkor</strong>! 👑
          </div>
          <button class="logout-btn" onclick="handleLogout()">
            🚪 Kijelentkezés
          </button>
        </div>

        <!-- Tab Navigation -->
        <div class="admin-tabs">
          <button class="tab-btn active" onclick="switchTab(event, 'raids')">
            ⚔️ Raid Progress
          </button>
          <button class="tab-btn" onclick="switchTab(event, 'roster')">
            👥 Roster Kezelés
          </button>
        </div>

        <!-- TAB 1: Raid Progress -->
        <div id="raids-tab" class="tab-content active">
          <!-- Current Stats -->
          <div class="stats-section">
            <h2>Jelenlegi Progress</h2>
            <div class="stats-grid" id="statsGrid"></div>
          </div>

          <!-- Raid Updates -->
          <div>
            <h2
              style="
                color: #d4af37;
                margin-bottom: 20px;
                font-size: 20px;
                text-transform: uppercase;
                letter-spacing: 1px;
              "
            >
              🎯 Raid Frissítés
            </h2>
            <div class="raids-grid" id="raidsGrid"></div>
          </div>
        </div>

        <!-- TAB 2: Roster Management -->
        <div id="roster-tab" class="tab-content">
          <!-- Add Player Section -->
          <div class="add-player-section">
            <h3>➕ Játékos Hozzáadása</h3>

            <div class="form-row">
              <div class="form-group">
                <label for="playerName">Játékos Neve</label>
                <input type="text" id="playerName" placeholder="pl: Zulkorrr" />
              </div>

              <div class="form-group">
                <label for="playerClass">Osztály</label>
                <select id="playerClass">
                  <option value="">Válassz osztályt...</option>
                  <option value="Warrior">Warrior</option>
                  <option value="Paladin">Paladin</option>
                  <option value="Hunter">Hunter</option>
                  <option value="Rogue">Rogue</option>
                  <option value="Priest">Priest</option>
                  <option value="Shaman">Shaman</option>
                  <option value="Mage">Mage</option>
                  <option value="Warlock">Warlock</option>
                  <option value="Monk">Monk</option>
                  <option value="Druid">Druid</option>
                  <option value="Demon Hunter">Demon Hunter</option>
                  <option value="Death Knight">Death Knight</option>
                  <option value="Evoker">Evoker</option>
                </select>
              </div>

              <div class="form-group">
                <label for="playerRole">Szerepkör</label>
                <select id="playerRole">
                  <option value="">Válassz szerepköt...</option>
                  <option value="Tank">Tank</option>
                  <option value="Healer">Healer</option>
                  <option value="DPS">DPS</option>
                </select>
              </div>

              <div class="form-group">
                <label for="playerRaiderIO">Raider.IO URL</label>
                <input
                  type="text"
                  id="playerRaiderIO"
                  placeholder="pl: https://raider.io/characters/eu/ragnaros/zulkorrr"
                />
              </div>
            </div>

            <button class="add-btn" onclick="addPlayer()">
              ✅ Játékos Hozzáadása
            </button>
          </div>
          <!-- Current Roster -->
          <div class="roster-table-wrapper">
            <h3
              style="
                color: #d4af37;
                padding: 20px 24px 10px;
                margin: 0;
                font-size: 18px;
                text-transform: uppercase;
                letter-spacing: 1px;
              "
            >
              📋 Aktuális Rooster
            </h3>
            <table class="roster-table">
              <thead>
                <tr>
                  <th>Játékos Neve</th>
                  <th>Osztály</th>
                  <th>Szerepkör</th>
                  <th>Akció</th>
                  <th>Delete</th>
                </tr>
              </thead>
              <tbody id="rosterTableBody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

    <script src="js/admin.js"></script>
    <script>
      const hamburger = document.getElementById("hamburger");
      const navMenu = document.getElementById("nav-menu");

      hamburger.addEventListener("click", () => {
        hamburger.classList.toggle("active");
        navMenu.classList.toggle("active");
      });
    </script>
  </body>
</html>
